name: Submit changed production URLs to IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          contains(github.event.deployment.environment, 'Production') ||
          contains(github.event.deployment.environment, 'production')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify changed-URL submission rules
        run: node --test scripts/indexnow-submit.test.mjs

      - name: Submit explicit changed URLs
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: npm run indexnow
