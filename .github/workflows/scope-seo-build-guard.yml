name: Scope, SEO and build guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-seo-build-guard:
    name: Scope, SEO and build guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SEO metadata coverage
        run: npm run audit:seo

      - name: Verify sitemap and internal link sources
        run: npm run audit:links

      - name: Build production bundle
        run: npm run build
