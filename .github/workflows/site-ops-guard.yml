name: Site Ops Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Scope, SEO and build guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify SEO metadata coverage
        run: npm run audit:seo

      - name: Verify sitemap and internal link sources
        run: npm run audit:links

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
