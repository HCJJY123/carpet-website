name: Site Ops Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_origin:
        description: Optional Vercel Preview origin for deployment verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: site-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Scope, SEO and build guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check approved scope and SEO red lines
        run: npm run ops:check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify Preview deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_origin != '' }}
        run: npm run ops:verify -- --origin=${{ inputs.target_origin }}
