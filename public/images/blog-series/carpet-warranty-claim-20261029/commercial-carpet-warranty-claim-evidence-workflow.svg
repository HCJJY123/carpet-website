<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial carpet warranty claim evidence workflow</title>
  <desc id="desc">Four stages connect written terms, exact product identity, site and maintenance evidence, and a documented review outcome.</desc>
  <rect width="1200" height="675" rx="32" fill="#f5f2eb"/>
  <path d="M0 506 C230 446 420 570 665 510 C895 454 1040 488 1200 435 V675 H0 Z" fill="#e4ddd0"/>
  <text x="72" y="84" fill="#153f3a" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Warranty claim evidence workflow</text>
  <text x="72" y="124" fill="#4e5b57" font-family="Arial, Helvetica, sans-serif" font-size="20">Preserve one controlled record before diagnosis, alteration or remedy decisions.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 190)">
      <rect width="230" height="270" rx="22" fill="#ffffff" stroke="#c8bca9" stroke-width="2"/>
      <circle cx="44" cy="45" r="22" fill="#d6774f"/>
      <text x="44" y="53" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">1</text>
      <text x="28" y="99" fill="#153f3a" font-size="22" font-weight="700">Written terms</text>
      <text x="28" y="139" fill="#4e5b57" font-size="15">Order and invoice</text>
      <text x="28" y="171" fill="#4e5b57" font-size="15">Applicable revision</text>
      <text x="28" y="203" fill="#4e5b57" font-size="15">Notice route</text>
      <text x="28" y="235" fill="#4e5b57" font-size="15">Contracting parties</text>
    </g>
    <path d="M318 325 H352" stroke="#8a7b67" stroke-width="4" stroke-linecap="round"/>
    <path d="M344 315 L357 325 L344 335" fill="none" stroke="#8a7b67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(368 190)">
      <rect width="230" height="270" rx="22" fill="#ffffff" stroke="#c8bca9" stroke-width="2"/>
      <circle cx="44" cy="45" r="22" fill="#bd985d"/>
      <text x="44" y="53" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">2</text>
      <text x="28" y="99" fill="#153f3a" font-size="22" font-weight="700">Product record</text>
      <text x="28" y="139" fill="#4e5b57" font-size="15">Exact construction</text>
      <text x="28" y="171" fill="#4e5b57" font-size="15">Colour or design</text>
      <text x="28" y="203" fill="#4e5b57" font-size="15">Labels and batch</text>
      <text x="28" y="235" fill="#4e5b57" font-size="15">Affected zones</text>
    </g>
    <path d="M614 325 H648" stroke="#8a7b67" stroke-width="4" stroke-linecap="round"/>
    <path d="M640 315 L653 325 L640 335" fill="none" stroke="#8a7b67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(664 190)">
      <rect width="230" height="270" rx="22" fill="#ffffff" stroke="#c8bca9" stroke-width="2"/>
      <circle cx="44" cy="45" r="22" fill="#557f77"/>
      <text x="44" y="53" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">3</text>
      <text x="28" y="99" fill="#153f3a" font-size="22" font-weight="700">Site evidence</text>
      <text x="28" y="139" fill="#4e5b57" font-size="15">Dated photographs</text>
      <text x="28" y="171" fill="#4e5b57" font-size="15">Installation history</text>
      <text x="28" y="203" fill="#4e5b57" font-size="15">Maintenance record</text>
      <text x="28" y="235" fill="#4e5b57" font-size="15">Retained material</text>
    </g>
    <path d="M910 325 H944" stroke="#8a7b67" stroke-width="4" stroke-linecap="round"/>
    <path d="M936 315 L949 325 L936 335" fill="none" stroke="#8a7b67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(960 190)">
      <rect width="168" height="270" rx="22" fill="#153f3a"/>
      <circle cx="44" cy="45" r="22" fill="#d6774f"/>
      <text x="44" y="53" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">4</text>
      <text x="24" y="99" fill="#ffffff" font-size="22" font-weight="700">Claim review</text>
      <text x="24" y="139" fill="#d9e6e2" font-size="15">Open evidence</text>
      <text x="24" y="171" fill="#d9e6e2" font-size="15">Site assessment</text>
      <text x="24" y="203" fill="#d9e6e2" font-size="15">Written outcome</text>
      <text x="24" y="235" fill="#d9e6e2" font-size="15">Closure record</text>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="516" width="1056" height="86" rx="18" fill="#ffffff" opacity="0.92"/>
    <text x="96" y="550" fill="#153f3a" font-size="18" font-weight="700">Buyer control</text>
    <text x="96" y="580" fill="#4e5b57" font-size="17">Do not infer defect, liability, coverage or remedy from appearance alone. Follow the applicable written terms.</text>
  </g>
</svg>
