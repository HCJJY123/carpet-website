<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Commercial carpet protection and handover workflow</title>
  <desc id="desc">Four connected stages: record the completed carpet zone, apply the approved protection, control and inspect access, then remove, clean and hand over the area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2ea"/>
      <stop offset="1" stop-color="#e5edef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26383b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="78" fill="#173b3f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Commercial carpet protection and handover</text>
  <text x="70" y="118" fill="#4b5f61" font-family="Arial, sans-serif" font-size="21">Connect the finished zone, approved protection, site access and final acceptance.</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 178)">
      <rect width="245" height="306" rx="20" fill="#fff"/>
      <circle cx="45" cy="48" r="25" fill="#b9844f"/>
      <text x="45" y="56" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">1</text>
      <text x="28" y="103" fill="#173b3f" font-size="24" font-weight="700">Record zone</text>
      <text x="28" y="143" fill="#4b5f61" font-size="18"><tspan x="28">• Carpet and system</tspan><tspan x="28" dy="30">• Completion time</tspan><tspan x="28" dy="30">• Initial condition</tspan><tspan x="28" dy="30">• Open exceptions</tspan></text>
      <rect x="28" y="253" width="189" height="32" rx="16" fill="#f2e7db"/>
      <text x="122" y="275" text-anchor="middle" fill="#7b552e" font-size="15" font-weight="700">FINISH RECORD</text>
    </g>
    <g transform="translate(344 178)">
      <rect width="245" height="306" rx="20" fill="#fff"/>
      <circle cx="45" cy="48" r="25" fill="#2e7b80"/>
      <text x="45" y="56" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">2</text>
      <text x="28" y="103" fill="#173b3f" font-size="24" font-weight="700">Protect</text>
      <text x="28" y="143" fill="#4b5f61" font-size="18"><tspan x="28">• Approved method</tspan><tspan x="28" dy="30">• Coverage and edges</tspan><tspan x="28" dy="30">• Routes and limits</tspan><tspan x="28" dy="30">• Named owner</tspan></text>
      <rect x="28" y="253" width="189" height="32" rx="16" fill="#dcebed"/>
      <text x="122" y="275" text-anchor="middle" fill="#245d62" font-size="15" font-weight="700">METHOD GATE</text>
    </g>
    <g transform="translate(618 178)">
      <rect width="245" height="306" rx="20" fill="#fff"/>
      <circle cx="45" cy="48" r="25" fill="#516b86"/>
      <text x="45" y="56" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">3</text>
      <text x="28" y="103" fill="#173b3f" font-size="24" font-weight="700">Control access</text>
      <text x="28" y="143" fill="#4b5f61" font-size="18"><tspan x="28">• Inspect routinely</tspan><tspan x="28" dy="30">• Repair protection</tspan><tspan x="28" dy="30">• Log incidents</tspan><tspan x="28" dy="30">• Hold changed zones</tspan></text>
      <rect x="28" y="253" width="189" height="32" rx="16" fill="#e2e7ed"/>
      <text x="122" y="275" text-anchor="middle" fill="#3d5269" font-size="15" font-weight="700">ACCESS LOG</text>
    </g>
    <g transform="translate(892 178)">
      <rect width="238" height="306" rx="20" fill="#173b3f"/>
      <circle cx="45" cy="48" r="25" fill="#d5a264"/>
      <text x="45" y="56" text-anchor="middle" fill="#173b3f" font-size="23" font-weight="700">4</text>
      <text x="28" y="103" fill="#fff" font-size="24" font-weight="700">Hand over</text>
      <text x="28" y="143" fill="#dbe6e7" font-size="18"><tspan x="28">• Authorize removal</tspan><tspan x="28" dy="30">• Clean as approved</tspan><tspan x="28" dy="30">• Inspect condition</tspan><tspan x="28" dy="30">• Accept/open items</tspan></text>
      <rect x="28" y="253" width="182" height="32" rx="16" fill="#d5a264"/>
      <text x="119" y="275" text-anchor="middle" fill="#173b3f" font-size="15" font-weight="700">ACCEPTANCE</text>
    </g>
  </g>
  <g fill="#9aa9aa">
    <path d="M321 325h17l-9-9 7-7 21 21-21 21-7-7 9-9h-17z"/>
    <path d="M595 325h17l-9-9 7-7 21 21-21 21-7-7 9-9h-17z"/>
    <path d="M869 325h17l-9-9 7-7 21 21-21 21-7-7 9-9h-17z"/>
  </g>
  <rect x="70" y="535" width="1060" height="82" rx="18" fill="#fff" opacity=".9"/>
  <text x="96" y="570" fill="#173b3f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Every zone record connects:</text>
  <text x="96" y="600" fill="#4b5f61" font-family="Arial, sans-serif" font-size="18">installed system · approved method · permitted access · inspections · removal · cleaning · acceptance</text>
  <text x="1105" y="649" text-anchor="end" fill="#637375" font-family="Arial, sans-serif" font-size="13">VCARPETS planning diagram · not a protection recommendation or site approval</text>
</svg>
