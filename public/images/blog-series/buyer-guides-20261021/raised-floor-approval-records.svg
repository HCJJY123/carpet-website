<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three records for raised-floor carpet procurement</title><desc id="desc">Separate panel information, carpet proposal and service-access review feed one project decision. This is a planning diagram, not an approved floor assembly.</desc><rect width="1200" height="675" fill="#f4f5f3"/><g font-family="Arial, sans-serif" fill="#123048"><text x="64" y="74" font-size="31" font-weight="700">RAISED-FLOOR CARPET PROCUREMENT</text><text x="64" y="116" font-size="23">Keep the finish decision connected to future service access.</text><rect x="64" y="165" width="340" height="255" rx="16" fill="white" stroke="#c6d0d7"/><text x="88" y="209" font-size="22" fill="#687b88">01</text><text x="88" y="252" font-size="28" font-weight="700">Panel record</text><text x="88" y="303" font-size="22">System reference</text><text x="88" y="341" font-size="22">Surface and condition</text><text x="88" y="379" font-size="22">Opening procedure</text><path d="M234 421 V465 H600" fill="none" stroke="#7c929f" stroke-width="3"/><rect x="430" y="165" width="340" height="255" rx="16" fill="white" stroke="#c6d0d7"/><text x="454" y="209" font-size="22" fill="#687b88">02</text><text x="454" y="252" font-size="28" font-weight="700">Carpet record</text><text x="454" y="303" font-size="22">Exact finish option</text><text x="454" y="341" font-size="22">Fixing proposal</text><text x="454" y="379" font-size="22">Applicable documents</text><path d="M600 421 V465 H600" fill="none" stroke="#7c929f" stroke-width="3"/><rect x="796" y="165" width="340" height="255" rx="16" fill="white" stroke="#c6d0d7"/><text x="820" y="209" font-size="22" fill="#687b88">03</text><text x="820" y="252" font-size="28" font-weight="700">Access record</text><text x="820" y="303" font-size="22">Service locations</text><text x="820" y="341" font-size="22">Review demonstration</text><text x="820" y="379" font-size="22">Facilities handoff</text><path d="M966 421 V465 H600" fill="none" stroke="#7c929f" stroke-width="3"/><path d="M600 465 V490" stroke="#7c929f" stroke-width="3"/><rect x="300" y="490" width="600" height="83" rx="14" fill="#123048"/><text x="600" y="525" text-anchor="middle" fill="white" font-size="26" font-weight="700">PROJECT REVIEW</text><text x="600" y="555" text-anchor="middle" fill="white" font-size="21">Record decisions and unresolved items.</text><text x="64" y="630" font-size="20" fill="#526877">Planning diagram only. No product or installation approval is implied.</text></g></svg>