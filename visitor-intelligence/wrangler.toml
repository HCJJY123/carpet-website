name = "vishome-visitor-intelligence"
main = "src/index.js"
compatibility_date = "2026-07-22"

[[d1_databases]]
binding = "DB"
database_name = "vishome_visitors"
database_id = "6cc70fed-f04b-4cf9-8d31-1b6190649279"

[[kv_namespaces]]
binding = "CACHE"
id = "5cb4456b929241fd9868e7f010c4cc1c"

[vars]
ALLOWED_ORIGINS = "https://www.vishomecarpet.com,https://vishomecarpet.com"
INTERNAL_COUNTRIES = "CN"
MIN_DURATION_SECONDS = "1"
MAX_BODY_BYTES = "4096"

# Secrets:
# wrangler secret put IPINFO_TOKEN
# wrangler secret put VISITOR_HASH_SALT
